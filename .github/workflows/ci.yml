name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Throw-away placeholders so the bundle compiles; real values never live in CI.
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Android JS bundle export
        run: npm run bundle

  # Rules tests: stranger / revoked / active / column access / writes.
  # The link function's deno tests get their own job in a later phase.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x edge-runtime,realtime,storage-api,imgproxy,studio,mailpit,vector,logflare,supavisor
      - run: supabase db reset
      - run: supabase test db
