name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python deps
        working-directory: generator
        run: uv sync --locked
      - name: ffmpeg (join and length-check tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Lint
        working-directory: generator
        run: |
          uv run ruff check .
          uv run ruff format --check .
      # Queue/pipeline/invite tests need the local Supabase database; they skip without it.
      # Start it once the scaffold's migrations are in the repo.
      - name: Start local Supabase
        if: hashFiles('supabase/migrations/*.sql') != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations (database only; same services as the database job)
        if: hashFiles('supabase/migrations/*.sql') != ''
        run: supabase start -x edge-runtime,realtime,storage-api,imgproxy,studio,mailpit,vector,logflare,supavisor
      - name: Test
        working-directory: generator
        run: uv run pytest -q -rs

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Throw-away placeholders so the bundle compiles; real values never live in CI.
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Android JS bundle export
        run: npm run bundle

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release.test.sh

  # Rules tests: stranger / revoked / active / column access / writes.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x edge-runtime,realtime,storage-api,imgproxy,studio,mailpit,vector,logflare,supavisor
      - run: supabase db reset
      - run: supabase test db

  link-function:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions/download-links
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno test --frozen

  accounts-function:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions/accounts
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno test --frozen
