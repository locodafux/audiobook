name: keepalive

# Pings the database every 3 days so the free Supabase project is never idle.
# Reads SUPABASE_URL and SUPABASE_ANON_KEY (public values) from repository secrets or variables;
# does nothing, and passes, while they are not set.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/keepalive.sh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
