[project]
name = "hearthread"
version = "0.1.0"
description = "Hearthread generator: turns EPUBs into per-chapter audio for the Hearthread app"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "mutagen>=1.47",
    "Pillow>=10.0",
    "psycopg[binary,pool]>=3.2",
    "boto3>=1.35",
    "httpx>=0.27",
]

[project.scripts]
hearthread = "hearthread.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearthread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
