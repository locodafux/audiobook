[project]
name = "hearthread"
version = "0.0.0"
description = "Hearthread generator: EPUB to chapter audio"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "ebooklib",
    "lxml",
    "Pillow",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearthread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
