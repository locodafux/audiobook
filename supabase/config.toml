# Hearthread Supabase config. No secrets: SMTP credentials come from env names only.
# `supabase start` uses this for the local stack; `supabase config push` applies the [auth] part to the hosted project.
project_id = "hearthread"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# No email links exist any more, so nothing redirects anywhere.
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Nobody can sign up through the public endpoint. Only the `accounts` function (service role) creates users.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
# The email PROVIDER must stay on: usernames sign in as a synthetic internal email with a password.
# Public sign-up stays closed by `[auth] enable_signup = false` above, not by this line.
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
max_frequency = "1s"

[auth.sms]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
